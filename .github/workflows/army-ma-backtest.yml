name: 台股共通軍線批次回測
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "sample=10檔；pilot=150檔先導；full=全市場分片（需 Token）"
        type: choice
        required: true
        default: sample
        options:
          - sample
          - pilot
          - full
      exit_mode:
        description: "original 僅真跌破出場；full 也加入假突破賣出"
        type: choice
        required: true
        default: original
        options:
          - original
          - full
permissions:
  contents: read
concurrency:
  group: army-ma-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    name: Python 單元測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: 合成日 K 整合測試（非真實台股績效）
        run: |
          python make_demo_data.py
          python army_ma.py --data demo_data --output results/smoke --first-ma 16 --last-ma 70

  sample:
    name: 下載 10 檔真實歷史行情
    needs: tests
    if: ${{ inputs.mode == 'sample' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[sample-run]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 下載樣本股票（FinMind 免費原始日K）
        run: python finmind_download.py --dataset TaiwanStockPrice --stocks 2317 2330 2454 2303 2603 2881 2345 3037 3661 3533 --out data --start 2017-01-01 --end 2026-10-22 --sleep 15
      - name: 保留測試行情
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historic-data-sample
          path: |
            data/*.csv
            data/*.json
          if-no-files-found: warn
          retention-days: 1

  pilot:
    name: 150 檔先導樣本實測（不公開原始行情）
    needs: tests
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'pilot') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[pilot-run]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 下載 150 檔免費真實日 K（未還原）
        run: |
          STOCKS=$(grep -v "^#" pilot_stocks.txt | xargs)
          python finmind_download.py --dataset TaiwanStockPrice --stocks $STOCKS --out data --start 2017-01-01 --end 2026-10-22 --min-success-rate 0.85 --sleep 3
      - name: SMA16–70 批次先導回測
        run: python army_ma.py --data data --output results --first-ma 16 --last-ma 70 --exit-mode "${{ inputs.exit_mode || 'original' }}"
      - name: 印出研究資料完整度
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          m=json.loads(Path('results/run_metadata.json').read_text(encoding='utf-8'))
          d=json.loads(Path('data/data_source_shard_0.json').read_text(encoding='utf-8'))
          print('下載成功:',d['downloaded_count'],'資料未調整:',not d['adjusted'])
          print('有效股票:',m['valid_stocks'],'預選參數:',m['selected_using_train_and_validation_only'])
          print('先導研究／非全台股隨機樣本／除權息未還原，數字不適合直接用於投資決策。')
          print(pd.read_csv('results/ma_summary_all.csv').query('period == "validation"').sort_values('coverage_pct',ascending=False).head(10).to_string(index=False))
          PY
      - name: 上傳衍生統計報表（不包含原始日K）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: army-ma-pilot-results
          path: |
            results/
            data/data_source_shard_0.json
            data/download_errors.csv
          if-no-files-found: warn
          retention-days: 30

  full:
    name: 全市場下載分片 ${{ matrix.shard }}
    needs: tests
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 檢查 API Token
        run: |
          if [ -z "$FINMIND_TOKEN" ]; then
            echo '請先在 GitHub Settings > Secrets and variables > Actions 設定 FINMIND_TOKEN。' >&2
            exit 1
          fi
      - name: 取回已下載快取
        uses: actions/cache/restore@v4
        with:
          path: data
          key: army-shard-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            army-shard-${{ matrix.shard }}-
      - name: 下載歷史日 K
        run: python finmind_download.py --dataset TaiwanStockPrice --out data --start 2017-01-01 --end 2026-10-22 --sleep 30 --shard-index ${{ matrix.shard }} --shard-count 4
      - name: 保存下次續跑快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: army-shard-${{ matrix.shard }}-${{ github.run_id }}
      - name: 保留下載分片
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historic-data-${{ matrix.shard }}
          path: data/*.csv
          if-no-files-found: warn
          retention-days: 1

  analyze:
    name: SMA16–70 回測與樣本外驗證
    needs: [tests, sample, full]
    if: ${{ always() && needs.tests.result == 'success' && (needs.sample.result == 'success' || needs.full.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 合併下載分片
        uses: actions/download-artifact@v4
        with:
          pattern: historic-data-*
          merge-multiple: true
          path: data
      - name: 執行回測
        run: python army_ma.py --data data --output results --first-ma 16 --last-ma 70 --exit-mode '${{ inputs.exit_mode || 'original' }}'
      - name: 資料覆蓋率摘要
        run: |
          python - <<'PY'
          import json,pandas as pd
          m=json.load(open('results/run_metadata.json',encoding='utf-8'))
          s=pd.read_csv('results/ma_summary_all.csv')
          from pathlib import Path
          sources=list(Path('data').glob('data_source*.json'))
          print('使用原始日 K：未還原除權息，僅供回測引擎驗證')
          print('資料來源紀錄:',len(sources))
          print('有效股票數:',m['valid_stocks'])
          print('研究狀態:',m['research_status'])
          print('訓練驗證預選:',m['selected_using_train_and_validation_only'])
          print(s.loc[s.period=='test',['ma','stocks_eligible','trades','coverage_pct']].head().to_string(index=False))
          PY
      - name: 保存回測報表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: army-ma-backtest-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
