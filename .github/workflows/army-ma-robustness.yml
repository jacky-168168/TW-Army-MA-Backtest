name: 軍線穩健性診斷
on:
  push:
    paths:
      - robustness_audit.py
      - .github/workflows/army-ma-robustness.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    name: 使用已完成的150檔交易結果進行穩健性壓力測試
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 讀取既有第13次衍生交易紀錄（不重複下載原始行情）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39908819980 --repo "$GITHUB_REPOSITORY" --name army-ma-pilot-results --dir audit-input
      - name: 檢查極端報酬與股票涵蓋率
        run: python robustness_audit.py --trades audit-input/results/trades_all.csv --output audit-results
      - name: 研究摘要
        run: cat audit-results/audit_summary.md
      - name: 上傳穩健性檢查結果
        uses: actions/upload-artifact@v4
        with:
          name: army-ma-robustness-audit
          path: audit-results/
          retention-days: 30
